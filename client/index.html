<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>GMS — Property Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen antialiased">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="GMS home">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>
            <span class="brand-name">GMS</span>
            <span class="brand-caption">Global Management Suite</span>
          </span>
        </a>
        <div class="sidebar-divider"></div>
        <span class="sidebar-label">Workspace</span>
        <nav class="sidebar-nav" aria-label="Workspace navigation">
          <button type="button" class="nav-item active" data-role="admin" aria-pressed="true">
            <span class="nav-icon" aria-hidden="true">▦</span>
            <span>All properties</span>
          </button>
          <button type="button" class="nav-item" data-role="property" aria-pressed="false">
            <span class="nav-icon" aria-hidden="true">◫</span>
            <span>Property overview</span>
          </button>
          <button type="button" class="nav-item" id="register-nav">
            <span class="nav-icon" aria-hidden="true">＋</span>
            <span>Register property</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span class="demo-indicator" aria-hidden="true"></span>
          <span><strong>Demo workspace</strong><small>Management console</small></span>
        </div>
      </aside>
      <main id="app" class="app-main" aria-live="polite">
        <p class="subtle">Loading property workspace…</p>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
